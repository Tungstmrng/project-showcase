
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Project - Project Showcase</title>

    <link rel="stylesheet" href="/css/add_project.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body data-requires-auth="true">

    <div class="heading">

        <div class="title">
            <a href="/index.html" class="title-name">
                Creations
            </a>
        </div>

        <div class="navbar">

            <a href="/index.html">Home</a>

            <a href="/html/top_project.html">Top Project</a>

            <a href="/html/add_project.html" id="addProjectLink" hidden>
                Add Project
            </a>

            <a href="/html/register.html" id="registerLink">Register</a>

            <a href="/html/login.html" id="loginLink">Login</a>

            <a href="#" id="logoutLink" hidden>Logout</a>

        </div>

    </div>


    <div class="add-project-container">

        <div class="add-project-box">

            <h1>Add Your Project</h1>

            <p>Share your creativity with the community.</p>

            <!-- Access Status -->
            <div id="accessStatus">
                Checking your project access...
            </div>

            <!-- Request Access Button -->
            <div id="requestAccessSection" hidden>

                <p>
                    You need contributor permission before uploading projects.
                </p>

                <a href="/html/request_access.html">
                    Request Project Access
                </a>

            </div>


            <!-- Project Form -->
            <div id="projectFormContainer" hidden>

                <form id="projectForm">

                    <label for="projectTitle">Project Title</label>
                    <input
                        type="text"
                        id="projectTitle"
                        placeholder="Enter your project title"
                        required
                    >

                    <label for="projectCategory">Project Category</label>
                    <select id="projectCategory" required>

                        <option value="">Select a category</option>
                        <option value="Game Development">Game Development</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Mobile Development">Mobile Development</option>
                        <option value="Graphic Design">Graphic Design</option>
                        <option value="Artificial Intelligence">Artificial Intelligence</option>
                        <option value="Other">Other</option>

                    </select>

                    <label for="projectDescription">Project Description</label>
                    <textarea
                        id="projectDescription"
                        placeholder="Describe your project..."
                        rows="5"
                        required
                    ></textarea>

                    <label for="projectTechnology">Technologies Used</label>
                    <input
                        type="text"
                        id="projectTechnology"
                        placeholder="e.g. HTML, CSS, JavaScript"
                        required
                    >

                    <!-- New Project URL Field -->
                    <label for="projectUrl">Project Link (Optional)</label>
                    <input
                        type="url"
                        id="projectUrl"
                        placeholder="https://github.com/username/project"
                    >

                    <label for="projectImage">Project Image</label>
                    <input
                        type="file"
                        id="projectImage"
                        accept="image/*"
                        required
                    >

                    <button type="submit">Submit Project</button>

                </form>

                <p id="projectMessage"></p>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/add_project.js"></script>

</body>
</html>
